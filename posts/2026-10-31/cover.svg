<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Deux costumes d'infirmière d'Halloween : avec un coeur, c'est OK ; avec une croix rouge, c'est interdit">
<rect width="800" height="600" fill="#2b1d4a"/>
<circle cx="680" cy="90" r="50" fill="#ffe9a8"/><circle cx="700" cy="78" r="44" fill="#2b1d4a"/>
<g fill="#ffffff" opacity="0.8"><circle cx="80" cy="60" r="2"/><circle cx="200" cy="110" r="2"/><circle cx="330" cy="50" r="2"/><circle cx="520" cy="120" r="2"/><circle cx="600" cy="40" r="2"/><circle cx="760" cy="180" r="2"/></g>
<text x="400" y="70" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#ffb347">Halloween 2026 : quel costume ?</text>
<!-- citrouilles -->
<g transform="translate(70 520)"><ellipse rx="45" ry="36" fill="#ff8c1a"/><rect x="-5" y="-48" width="10" height="16" fill="#3c7a2a"/><path d="M-22 -8 L-10 -18 L-2 -8 Z M22 -8 L10 -18 L2 -8 Z" fill="#2b1d4a"/><path d="M-22 10 Q0 28 22 10 Q0 18 -22 10 Z" fill="#2b1d4a"/></g>
<g transform="translate(730 525)"><ellipse rx="40" ry="32" fill="#ff8c1a"/><rect x="-5" y="-42" width="10" height="14" fill="#3c7a2a"/><circle cx="-12" cy="-6" r="6" fill="#2b1d4a"/><circle cx="12" cy="-6" r="6" fill="#2b1d4a"/><path d="M-16 12 Q0 24 16 12" stroke="#2b1d4a" stroke-width="5" fill="none"/></g>
<!-- personnage gauche : coeur -->
<g transform="translate(240 330)">
  <rect x="-120" y="-230" width="240" height="420" rx="24" fill="#e8fbe9"/>
  <circle cx="0" cy="-130" r="45" fill="#ffd8b8"/>
  <path d="M-48 -160 Q0 -205 48 -160 L40 -150 L-40 -150 Z" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M0 -175 c-6 -10 -20 -6 -16 4 c2 6 16 14 16 14 c0 0 14 -8 16 -14 c4 -10 -10 -14 -16 -4 Z" fill="#ff5c8a"/>
  <circle cx="-15" cy="-132" r="5" fill="#333"/><circle cx="15" cy="-132" r="5" fill="#333"/><path d="M-15 -110 Q0 -98 15 -110" stroke="#333" stroke-width="4" fill="none"/>
  <path d="M-70 -80 L70 -80 L85 120 L-85 120 Z" fill="#ffffff" stroke="#c9c9c9" stroke-width="3"/>
  <path d="M0 -20 c-12 -20 -40 -12 -32 8 c4 12 32 28 32 28 c0 0 28 -16 32 -28 c8 -20 -20 -28 -32 -8 Z" fill="#ff5c8a"/>
  <g transform="translate(78 30) rotate(-30)"><rect x="-6" y="-40" width="12" height="60" rx="3" fill="#bfe3ff" stroke="#6a8fb0" stroke-width="2"/><rect x="-2" y="20" width="4" height="22" fill="#888"/><rect x="-14" y="-46" width="28" height="6" fill="#6a8fb0"/></g>
  <text x="0" y="170" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#2e9d4a">OK !</text>
</g>
<!-- personnage droit : croix rouge interdite -->
<g transform="translate(560 330)">
  <rect x="-120" y="-230" width="240" height="420" rx="24" fill="#ffe6e6"/>
  <circle cx="0" cy="-130" r="45" fill="#ffd8b8"/>
  <path d="M-48 -160 Q0 -205 48 -160 L40 -150 L-40 -150 Z" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <circle cx="-15" cy="-132" r="5" fill="#333"/><circle cx="15" cy="-132" r="5" fill="#333"/><path d="M-12 -106 Q0 -114 12 -106" stroke="#333" stroke-width="4" fill="none"/>
  <path d="M-70 -80 L70 -80 L85 120 L-85 120 Z" fill="#ffffff" stroke="#c9c9c9" stroke-width="3"/>
  <path d="M-12 -40 H12 V-16 H36 V8 H12 V32 H-12 V8 H-36 V-16 H-12 Z" fill="#e8192c"/>
  <circle cx="0" cy="-4" r="62" fill="none" stroke="#333" stroke-width="8"/>
  <line x1="-44" y1="-48" x2="44" y2="40" stroke="#333" stroke-width="8"/>
  <text x="0" y="170" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#d0021b">Interdit</text>
</g>
<text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#ffffff">Coeur et seringue en jouet : oui. Croix rouge (même rose) : non !</text>
</svg>
