<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Le bâtiment du nouveau 防災庁 et un enfant avec son sac de secours">
<rect width="800" height="600" fill="#cfeeff"/>
<circle cx="700" cy="90" r="50" fill="#ffd84d"/>
<rect y="470" width="800" height="130" fill="#9fd88a"/>
<text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1f4e79">2 novembre 2026 : le Bōsai-chō est né !</text>
<!-- bâtiment -->
<rect x="90" y="150" width="330" height="330" fill="#f4f1ea" stroke="#8a8a8a" stroke-width="3"/>
<g fill="#7fb2d9"><rect x="120" y="250" width="50" height="50"/><rect x="200" y="250" width="50" height="50"/><rect x="280" y="250" width="50" height="50"/><rect x="360" y="250" width="40" height="50"/>
<rect x="120" y="330" width="50" height="50"/><rect x="280" y="330" width="50" height="50"/><rect x="360" y="330" width="40" height="50"/></g>
<rect x="200" y="400" width="70" height="80" fill="#6b4b2a"/>
<rect x="130" y="170" width="250" height="60" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="4"/>
<text x="255" y="214" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#c0392b">防災庁</text>
<rect x="196" y="330" width="58" height="50" fill="#ffffff" stroke="#8a8a8a"/>
<text x="225" y="362" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">352</text>
<!-- enfant -->
<g transform="translate(560 360)">
  <rect x="-62" y="-50" width="52" height="90" rx="12" fill="#e67e22"/>
  <rect x="-52" y="-28" width="32" height="20" rx="4" fill="#ffffff"/>
  <text x="-36" y="-13" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e67e22">SOS</text>
  <circle cx="0" cy="-90" r="42" fill="#ffd8b8"/>
  <path d="M-42 -100 Q0 -150 42 -100 Q20 -118 0 -116 Q-22 -118 -42 -100 Z" fill="#3b2a1a"/>
  <circle cx="-14" cy="-92" r="5" fill="#333"/><circle cx="14" cy="-92" r="5" fill="#333"/>
  <path d="M-16 -70 Q0 -56 16 -70" stroke="#333" stroke-width="4" fill="none"/>
  <rect x="-32" y="-48" width="64" height="100" rx="14" fill="#3498db"/>
  <rect x="-28" y="52" width="22" height="58" fill="#2c3e50"/><rect x="6" y="52" width="22" height="58" fill="#2c3e50"/>
  <path d="M32 -30 L70 -70" stroke="#ffd8b8" stroke-width="14" stroke-linecap="round"/>
</g>
<!-- réserves -->
<g transform="translate(660 430)">
  <rect x="0" y="0" width="28" height="70" rx="8" fill="#aee3ff" stroke="#2e86c1" stroke-width="3"/><rect x="8" y="-10" width="12" height="12" fill="#2e86c1"/>
  <rect x="36" y="0" width="28" height="70" rx="8" fill="#aee3ff" stroke="#2e86c1" stroke-width="3"/><rect x="44" y="-10" width="12" height="12" fill="#2e86c1"/>
  <rect x="72" y="30" width="40" height="40" rx="4" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="72" y="40" width="40" height="14" fill="#e74c3c"/>
</g>
<g transform="translate(470 470)"><rect x="0" y="0" width="60" height="22" rx="6" fill="#f1c40f" stroke="#b7950b" stroke-width="3"/><path d="M60 0 L80 -8 L80 30 L60 22 Z" fill="#fff7c2" stroke="#b7950b" stroke-width="3"/></g>
<text x="400" y="575" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1f4e79">Eau, nourriture, lampe : mon kit est prêt !</text>
</svg>
